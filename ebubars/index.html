<!DOCTYPE html>
<html>
    <head>
        <title>EBU colour bars</title>
    </head>
    <body> <!-- width="768" height="576" viewBox="0 0 768 576" xmlns="http://www.w3.org/2000/svg" -->
        <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="-10 -5 1280 720" preserveAspectRatio="xMidYMid">
            <!-- EBU colour bar pattern (100/0/100/0 variant) -->
          
            <!-- Bar 1: White -->
            <rect x="0" y="0" width="182" height="720" fill="#FFFFFF" />
          
            <!-- Bar 2: Yellow -->
            <rect x="183" y="0" width="183" height="720" fill="#FFFF00" />
          
            <!-- Bar 3: Cyan -->
            <rect x="365" y="0" width="183" height="720" fill="#00FFFF" />
          
            <!-- Bar 4: Green -->
            <rect x="547" y="0" width="183" height="720" fill="#00FF00" />
          
            <!-- Bar 5: Magenta -->
            <rect x="729" y="0" width="183" height="720" fill="#FF00FF" />
          
            <!-- Bar 6: Red -->
            <rect x="911" y="0" width="183" height="720" fill="#FF0000" />
          
            <!-- Bar 7: Blue -->
            <rect x="1093" y="0" width="183" height="720" fill="#0000FF" />
          
            <!-- Bar 8: Black -->
            <rect x="1280" y="0" width="183" height="720" fill="#000000" />
          </svg>
    </body>
</html>
