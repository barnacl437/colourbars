<!DOCTYPE html>
<html>
    <head>
        <title>EBU colour bars</title>
    </head>
    <body>
        <svg width="768" height="576" viewBox="0 0 768 576" xmlns="http://www.w3.org/2000/svg">
            <!-- EBU colour bar pattern (100/0/100/0 variant) -->
          
            <!-- Bar 1: White -->
            <rect x="0" y="0" width="96" height="576" fill="#FFFFFF" />
          
            <!-- Bar 2: Yellow -->
            <rect x="96" y="0" width="96" height="576" fill="#FFFF00" />
          
            <!-- Bar 3: Cyan -->
            <rect x="192" y="0" width="96" height="576" fill="#00FFFF" />
          
            <!-- Bar 4: Green -->
            <rect x="288" y="0" width="96" height="576" fill="#00FF00" />
          
            <!-- Bar 5: Magenta -->
            <rect x="384" y="0" width="96" height="576" fill="#FF00FF" />
          
            <!-- Bar 6: Red -->
            <rect x="480" y="0" width="96" height="576" fill="#FF0000" />
          
            <!-- Bar 7: Blue -->
            <rect x="576" y="0" width="96" height="576" fill="#0000FF" />
          
            <!-- Bar 8: Black -->
            <rect x="672" y="0" width="96" height="576" fill="#000000" />
          </svg>
    </body>
</html>
